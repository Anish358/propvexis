name: Deploy to AWS

# PROD (app.propvexis.com). Merge to main auto-deploys. The heavy lifting lives
# in the reusable deploy-env.yml; this caller just points it at the prod app dir
# / pm2 app and enables the Prometheus+Grafana monitoring job (prod only).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two prod deploys at once; let an in-flight deploy finish.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy-env.yml
    with:
      app_dir: /opt/amey-journal
      pm2_app: amey-backend
      run_monitoring: true
    secrets: inherit
