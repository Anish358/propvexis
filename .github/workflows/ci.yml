name: CI

# Fast feedback BEFORE code reaches prod: run the test suite on every PR to main
# and every push to dev. The deploy workflow re-runs tests as a final gate, but
# this surfaces failures as a red check on the PR so they're caught pre-merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20' # match the production box
          cache: 'npm'
      - run: npm ci
      - run: npm test
