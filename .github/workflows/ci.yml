name: CI

# Fast feedback BEFORE code reaches prod: run the test suite on every PR to main
# or dev, and every push to dev. The deploy workflow re-runs tests as a final
# gate, but this surfaces failures as a red check on the PR so they're caught
# pre-merge.
#
# `dev` IS IN THE PR LIST FOR A REASON. It used to be main-only, and the effect
# was invisible: Dependabot targets dev, so a PR to dev matched neither trigger —
# not `pull_request` (wrong base) and not `push` (a PR branch is not dev). Nine
# dependency PRs sat there showing a green tick that came from a third-party
# secret scanner, with the test suite never having run on any of them. A PR that
# runs no checks looks exactly like a PR that passed them.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22' # match the production box
          cache: 'npm'
      - run: npm ci

      # THE FRONTEND INSTALL HAS TO COME BEFORE `npm test`, NOT AFTER (2026-09-11).
      # test/kit-tabs.test.js imports the real `cn` from frontend/src/lib/utils.js
      # so it can run the actual clsx + tailwind-merge pipeline against the
      # registry's classes — reimplementing that merge would only test the
      # reimplementation. `npm ci` above installs the BACKEND tree, so clsx was
      # unresolvable and the file failed here while passing on every dev machine.
      #
      # It failed in the worst available way: the import was a mid-file top-level
      # await, which suspends the module, so the nine tests above it ran green,
      # the two below it never registered, and the only symptom was a stray
      # "asynchronous activity after the test ended". 2114 passing instead of
      # 2116, with the missing two guarding a bug that had already shipped. The
      # import is static now, so a missing dependency fails the file outright —
      # and this step is what keeps it present. Same reorder in deploy-env.yml.
      #
      # IT EARNS ITS PLACE TWICE OVER, and the original reason still stands: the
      # frontend has its OWN lockfile and was once never checked here at all, so
      # a broken frontend dependency passed every check on the PR and failed
      # later in deploy-env.yml — after the merge. Same shape as the `dev`-trigger
      # bug at the top of this file: a check that never ran looks identical to one
      # that passed. `ci` (not `install`) on purpose — it fails on a lockfile that
      # does not satisfy package.json, which is the real bug class here: PR #87
      # bumped react-dom to 19 while react stayed at 18, and react-dom@19 peers on
      # react@^19.
      - run: npm --prefix frontend ci

      - run: npm test

      # `no-undef` ACROSS BOTH TREES. The suite above cannot see an identifier that
      # is called but never imported: the module still loads, and the ReferenceError
      # fires per-request inside a handler (that shipped on /api/prop/finance for
      # weeks) or on the render of one page (Billing.jsx called an unimported
      # `titleCase` in prod). `vite build` only catches a missing named export.
      # eslint.config.js runs exactly that one rule, so this step is red only when
      # something is genuinely undefined.
      - run: npm run lint

      # The second half of the frontend check: the install moved above the suite
      # (see the note there), and this proves the code still COMPILES against the
      # tree that install resolved.
      - name: Frontend build
        run: npm --prefix frontend run build

      # The sync agent is Python (the MT5 API is a Windows Python package), so its
      # unit tests cannot run under node:test. history.py deliberately imports
      # nothing from MetaTrader5 precisely so this step needs no Windows runner and
      # no dependencies — if these tests ever need `pip install`, that is a signal
      # the deal-grouping logic has picked up a coupling it should not have.
      - name: Sync agent unit tests
        run: python3 -m unittest discover -s agent -v
