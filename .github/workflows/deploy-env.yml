name: Deploy (reusable)

# Reusable deploy workflow shared by all three environments. The per-env caller
# workflows (deploy.yml=prod, deploy-staging.yml, deploy-dev.yml) pass in which
# app dir / pm2 app to target so a deploy touches exactly one environment on the
# shared box. See ecosystem.config.cjs for the env→port→dir→SSM-prefix table.
on:
  workflow_call:
    inputs:
      app_dir:
        description: Absolute target dir on the box (e.g. /opt/amey-journal)
        required: true
        type: string
      pm2_app:
        description: pm2 app name to reload (e.g. amey-backend)
        required: true
        type: string
      run_monitoring:
        description: Bring up/update the Prometheus+Grafana stack (prod only)
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22' # match the production box
          cache: 'npm'

      # Gate the deploy on the backend test suite — a red test aborts before
      # anything is synced to the server.
      - name: Test backend
        run: |
          npm ci
          npm test

      - name: Build frontend
        env:
          # Empty => the SPA calls the API/Socket.IO with RELATIVE same-origin URLs,
          # so it works on EVERY domain Caddy fronts (app.propvexis.com,
          # app-staging.propvexis.com, app-dev.propvexis.com, …) and the
          # SameSite=Lax session cookie is always sent. Do NOT hardcode a host:
          # a cross-domain absolute URL would break login (Lax cookie not sent
          # cross-site). Each Caddy vhost proxies /api to its own backend port.
          VITE_BACKEND_URL: ""
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          # Public (client-side) Sentry DSN — safe to expose; baked into the bundle.
          VITE_SENTRY_DSN: https://770769a772da9fa5b92512ca9279088b@o4508103223017472.ingest.us.sentry.io/4511670762799104
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Set up SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Populate known_hosts with retries: ssh-keyscan can transiently fail to
          # reach the host, and under `bash -e` that aborts the entire deploy
          # (root cause of the PR #24 deploy failure). Retry, then fail loudly
          # only if every attempt produced nothing.
          for i in 1 2 3 4 5; do
            if ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ]; then
              echo "known_hosts populated (attempt $i)"
              break
            fi
            echo "ssh-keyscan attempt $i failed; retrying in 5s..."
            sleep 5
          done
          test -s ~/.ssh/known_hosts

      - name: Sync code to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          APP_DIR: ${{ inputs.app_dir }}
        run: |
          # App code (no --delete: leaves .env, node_modules, logs on the box untouched).
          # `monitoring/` + the prod monitoring compose ship to every env dir; they're
          # inert unless the monitoring job runs (prod only). scripts/ (incl.
          # monitoring-up.sh) is already in this list.
          rsync -az -e "ssh -i ~/.ssh/deploy_key" \
            package.json package-lock.json ecosystem.config.cjs src db scripts ea \
            monitoring docker-compose.monitoring.prod.yml \
            "$SSH_USER@$SSH_HOST:$APP_DIR/"
          # Built UI (--delete clears stale hashed Vite assets)
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ \
            "$SSH_USER@$SSH_HOST:$APP_DIR/frontend/dist/"

      - name: Install deps, migrate DB, restart backend
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          APP_DIR: ${{ inputs.app_dir }}
          PM2_APP: ${{ inputs.pm2_app }}
        run: |
          # Pass APP_DIR/PM2_APP into the remote shell as env vars; the heredoc is
          # single-quoted so everything else expands ON the box, not locally.
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "APP_DIR='$APP_DIR' PM2_APP='$PM2_APP' bash -s" <<'REMOTE'
          set -e
          cd "$APP_DIR"
          npm install --omit=dev
          # The migrate script is a standalone process (not pm2), so it needs the
          # same bootstrap env pm2 gets — chiefly SSM_PREFIX, which tells the
          # secrets loader to hydrate DATABASE_URL et al. from SSM. Source it from
          # THIS env's app entry in the ecosystem file (single source of truth).
          export $(node -e "const a=require('./ecosystem.config.cjs').apps.find(x=>x.name===process.env.PM2_APP); if(!a){console.error('no pm2 app named '+process.env.PM2_APP);process.exit(1)} console.log(Object.entries(a.env).map(([k,v])=>k+'='+v).join(' '))")
          node scripts/migrate.js
          # --only <app> so deploying one env never restarts the others sharing
          # this pm2 daemon. startOrReload applies the bootstrap env from the
          # version-controlled ecosystem file (survives fresh start / reboot);
          # pm2 save persists the process list for reboot resurrection.
          pm2 startOrReload ecosystem.config.cjs --only "$PM2_APP" --update-env
          pm2 save
          REMOTE

  # Bring up / update the Prometheus + Grafana stack on the box. A SEPARATE job
  # (needs: deploy) so a monitoring hiccup never marks the app deploy as failed —
  # the backend is already live by the time this runs. Prod-only: gated on the
  # run_monitoring input. The assets were rsynced by the deploy job above.
  monitoring:
    needs: deploy
    if: ${{ inputs.run_monitoring }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          for i in 1 2 3 4 5; do
            if ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ]; then
              echo "known_hosts populated (attempt $i)"
              break
            fi
            echo "ssh-keyscan attempt $i failed; retrying in 5s..."
            sleep 5
          done
          test -s ~/.ssh/known_hosts

      - name: Bring up monitoring stack
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          # Required: Grafana is internet-facing, so monitoring-up.sh fails
          # closed if this GitHub secret is empty (no default-password fallback).
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "GRAFANA_PASSWORD='${GRAFANA_PASSWORD}' bash /opt/amey-journal/scripts/monitoring-up.sh"

      # Reload Caddy only if the Grafana site block changed this deploy (the
      # rsync above ships monitoring/ but does not touch Caddy). No-op otherwise.
      - name: Reload Caddy if Grafana site block changed
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "bash /opt/amey-journal/scripts/caddy-reload-if-changed.sh"
