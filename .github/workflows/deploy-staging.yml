name: Deploy staging

# STAGING (app-staging.propvexis.com) ← amey-dev branch. Pushing amey-dev
# auto-deploys to the staging stack on the shared box (port 3001,
# /opt/amey-staging, SSM /amey-journal/staging/). No monitoring job — the single
# Prometheus+Grafana stack is prod-only.
on:
  push:
    branches: [amey-dev]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy-env.yml
    with:
      app_dir: /opt/amey-staging
      pm2_app: amey-backend-staging
    secrets: inherit
