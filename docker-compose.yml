# Local dev/prod-parity stack: PostgreSQL + the containerized backend.
# Mirrors production (Node app + native Postgres) without touching the live
# deploy (which stays rsync + pm2). Frontend runs separately via `vite`.
#
#   docker compose up --build      # build + start
#   curl localhost:3000/health     # {"ok":true}
#
# No secrets are committed here — credentials come from the environment (or the
# benign local defaults below). Override by exporting the vars or via a local
# .env file (compose auto-loads it): SESSION_SECRET, INGEST_TOKEN, etc.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amey}
      POSTGRES_DB: ${POSTGRES_DB:-amey_journal}
      # Local throwaway DB: trust auth = no password needed, so no password
      # literal is committed (prod Postgres is separate and password-protected).
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432" # matches the local dev convention (host 5433)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amey} -d ${POSTGRES_DB:-amey_journal}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development # local: skips prod fail-closed + Secure cookies (no HTTPS locally)
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-amey}@db:5432/${POSTGRES_DB:-amey_journal}
      SESSION_SECRET: ${SESSION_SECRET:-local-development-only}
      INGEST_TOKEN: ${INGEST_TOKEN:-local-development-only}
      OPEN_SIGNUP: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-} # set to test real Google login
    ports:
      - "3000:3000"
    # Initialize schema + run migrations, then start (setup-db.js is idempotent).
    command: sh -c "node scripts/setup-db.js && node scripts/migrate.js && node src/server.js"

  # ---- Monitoring stack (opt-in) ----------------------------------------
  # Not started by a plain `docker compose up` — they live under the
  # "monitoring" profile so the app stack stays lightweight by default:
  #
  #   docker compose --profile monitoring up -d   # app + Prometheus + Grafana
  #   Prometheus → http://localhost:9090
  #   Grafana    → http://localhost:3001  (admin / admin, or GRAFANA_PASSWORD)
  #
  # Prometheus scrapes the backend's /metrics; Grafana auto-provisions the
  # Prometheus datasource and the "Amey Journal — Backend" dashboard.
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    depends_on:
      - backend
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["monitoring"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3001:3000" # host 3001 → Grafana's 3000 (3000 is the backend locally)

volumes:
  pgdata:
  promdata:
  grafanadata:
